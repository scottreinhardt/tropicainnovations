<!DOCTYPE html>
<html>
<head>
  <title>Temperature Markers</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    const map = L.map('map').setView([42, -70], 6);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
    }).addTo(map);

    function getTempColor(temp) {
      if (temp <= 32) return 'blue';
      if (temp <= 50) return 'cyan';
      if (temp <= 70) return 'green';
      if (temp <= 85) return 'orange';
      return 'red';
    }

    fetch('/home/tropicainnovations/mysite/gfs_dump.json')
      .then(res => res.json())
      .then(data => {
        data.forEach(site => {
          const color = getTempColor(site.temp_f);
          const marker = L.circleMarker([site.lat, site.lon], {
            radius: 10,
            fillColor: color,
            color: '#000',
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
          }).addTo(map);

          marker.bindPopup(`<b>${site.name} (${site.icao})</b><br>Temp: ${site.temp_f} °F`);
        });
      });
  </script>
</body>
</html>
