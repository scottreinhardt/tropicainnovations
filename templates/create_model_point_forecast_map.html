  if (temp <= 90)  return '#cc0000'; // vibrant red
  return '#ffffff'; // 100°F or hotter → white
}

    function createThermometerSVG(temp) {
      const fluidHeight = Math.max(0, Math.min(100, (temp + 40) / (120 + 40) * 160)); // Map -40°F to 120°F into 0–160px
      const fluidY = 190 - fluidHeight;  // 190 is near bottom of tube

      const gradientId = `grad_${Math.floor(Math.random() * 100000)}`;

      return `
        <svg width="80" height="200" viewBox="0 0 80 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="${gradientId}" x1="0" y1="200" x2="0" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="red" />
              <stop offset="100%" stop-color="blue" />
            </linearGradient>
          </defs>
          <rect x="30" y="20" width="20" height="160" fill="white" stroke="black" stroke-width="2" rx="10" ry="10"/>
          <rect x="30" y="${fluidY}" width="20" height="${fluidHeight}" fill="url(#${gradientId})" />
          <circle cx="40" cy="190" r="20" fill="url(#${gradientId})" stroke="black" stroke-width="2"/>
          <text x="40" y="100" text-anchor="middle" font-size="18" fill="black">${Math.round(temp)}°F</text>
        </svg>
      `;
    }

    function getColorFromTemperature(temp) {
      // Normalize temp between -40°F and 120°F
      const minTemp = -40;
      const maxTemp = 120;
      const clampedTemp = Math.max(minTemp, Math.min(maxTemp, temp));
      const ratio = (clampedTemp - minTemp) / (maxTemp - minTemp);

      // Map ratio to a color (blue to red)
      const r = Math.round(255 * ratio);
      const g = Math.round(255 * (1 - Math.abs(ratio - 0.5) * 2)); // Green strongest around 50%
      const b = Math.round(255 * (1 - ratio));

      return `rgb(${r}, ${g}, ${b})`;
    }

    function convert_utc_to_local(validHours, timeZone) {
       // validHours is len 12
       // validHours = {"5": "2025-05-02 00:00:00", "6": "2025-05-02 12:00:00"}
      const local_hours = [];
      // Loop through every str(hour) in validHours
      // Note that validHours is just {str(hour):str(utc_datetime_of_hour)}
      // So key (hour) is just str(hour)
      // Should loop through all 2 hours in this example shown above
      for (const hour of Object.keys(validHours)) {
        // validHours[hour] is just the value for str(hour) or the UTC datetime for that hour in string form
        const utcString = validHours[hour];
        // Some minor logic to manipulate the string date to get it to a form to change to an actual Date() javascript object
        const fixedUtc = utcString.replace(" ", "T") + "Z";
        // Create the Javascript Date() object: Date(utc_string)
        const utcDate = new Date(fixedUtc);
        // Specifify that you only need the hour and it should be in 24 hour time and in numeric format with the timeZone string
        const options = {
          timeZone,
          hour: 'numeric',
          hour12: true
        };
        // Convert the utc Date Object to the local time and save as a String
        const localHour = utcDate.toLocaleString('en-US', options);
        // Push the hour (2 digits) to the local_hours arr
        local_hours.push(localHour);
      }

      return local_hours;
    }
