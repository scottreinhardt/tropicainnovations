<!DOCTYPE html>
<html>
<head>
  <title>Model Maps</title>
  <!-- Bootstrap CSS (from CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <style>
    /* Banner styling */
    .website_banner {
      background: linear-gradient(90deg, #007BFF, #00C6FF); /* Blue to cyan gradient */
      width: 100%;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2em;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2); /* Subtle shadow */
    }

    .website_banner #website_title_header {
      font-size: 36px;
      font-weight: bold;
    }

    /* Navbar */
    .navbar {
      background-color: #005A9E; /* Darker blue */
      color: white;
    }

    .navbar-brand, .nav-link {
      color: white !important;
    }

    /* Main container styling */
    .website_content {
      display: flex;
      width: 100%;
      height: 1000px;
      padding: 20px;
      background: #F4F6F9; /* Light grey background for main content */
    }

    /* Choices column styling */
    .choices_column {
      width: 25%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Content sections inside choices column */
    .model_choice, .region_choice, .product_choice, .hour_choice {
      background: #FFFFFF; /* White background for contrast */
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); /* Soft shadow */
    }
    .submit_button {
      display: inline-block;
      width: 100%;
      background: #FFFFFF; /* White background for contrast */
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); /* Soft shadow */
    }
    .submit-reset-buttons label {
      flex: 1 1 30%; /* Sets each button to approximately 30% width */
      text-align: center;
      gap: 0px;
    }

    /* Section title styling */
    #section_title {
      text-align: center;
      font-weight: bold;
      color: #005A9E;
    }

    /* Model output window styling */
    .model_output_window {
      width: 70%;
      height: 100%;
      background: #FFFFFF;
      border-radius: 8px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      margin-left: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .section_content {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Footer styling */
    .footer {
      background-color: #002F6C;
      color: white;
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .footer button {
      background-color: #007BFF; /* Highlighted blue buttons */
      border: none;
    }

    /* Button styles */
    .btn-outline-primary {
      color: #007BFF;
      border-color: #007BFF;
    }
    .btn-outline-primary:hover, .btn-check:checked + .btn-outline-primary {
      background-color: #007BFF;
      color: #FFFFFF;
    }

    /* Grid styling */
    .grid-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0px;
      justify-content: center;
    }
    .grid-buttons label {
      flex: 1 1 25%;
      text-align: center;
    }

    /* Grid styling for Product Choice buttons */
    .product-grid {
      display: flex;
      flex-wrap: wrap; /* Allows buttons to wrap to the next row */
      gap: 10px;
      justify-content: center;
    }

    /* Each button will take 30% of the container to fit 3 buttons per row */
    .product-grid label {
      flex: 1 1 30%; /* Sets each button to approximately 30% width */
      text-align: center;
    }

    /* Grid styling for Region Choice buttons */
    .region-grid {
      display: flex;
      flex-wrap: wrap; /* Allows buttons to wrap to the next row */
      gap: 10px;
      justify-content: center;
    }

    /* Each button will take 30% of the container to fit 3 buttons per row */
    .region-grid label {
      flex: 1 1 30%; /* Sets each button to approximately 30% width */
      text-align: center;
    }

    /* Grid styling for Region Choice buttons */
    .model-grid {
      display: flex;
      flex-wrap: wrap; /* Allows buttons to wrap to the next row */
      gap: 10px;
      justify-content: center;
    }

    /* Each button will take 30% of the container to fit 3 buttons per row */
    .model-grid label {
      flex: 1 1 30%; /* Sets each button to approximately 30% width */
      text-align: center;
    }
    /* overrides the input style of the circle for radio buttons */
    [type='radio'] {
      display: none;
    }

  </style>
</head>
<body>
  <div class="website_frame">
    <!-- Banner -->
    <div class="website_banner">
      <div id="website_title_header">Model Maps</div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
      <a class="navbar-brand" href="#">
        <img src="http://tropicainnovations.weebly.com/uploads/3/6/0/1/3601755/tropica-logo-png-001_orig.png" style="width:35px;height:35px;">
        Tropica Innovations
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item active">
            <a class="nav-link" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Services</a>
          </li>
        </ul>
        <form class="form-inline my-2 my-lg-0">
          <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search">
          <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
        </form>
      </div>
    </nav>

    <!-- Content Section -->
    <div class="website_content">
      <div class="choices_column">

        <div class="model_choice">
          <div id="section_title">Choose a Model</div>
          <hr>
          <div class="section_content model-grid">
            <input type="radio" class="btn-check" name="model" id="model1" autocomplete="off" value="HRRR">
            <label class="btn btn-outline-primary" for="model1">HRRR</label>
          </div>
        </div>
        <div class="region_choice">
          <div id="section_title">Choose a Region</div>
          <hr>
          <div class="section_content region-grid">
            <input type="radio" class="btn-check" name="region" id="region1" autocomplete="off" value="us_extent">
            <label class="btn btn-outline-primary" for="region1">Continental US</label>

            <input type="radio" class="btn-check" name="region" id="region2" autocomplete="off" value="new_england_extent">
            <label class="btn btn-outline-primary" for="region2">New England</label>
          </div>
        </div>
        <div class="product_choice">
          <div id="section_title">Choose a Product</div>
          <hr>
          <div class="section_content product-grid">
            <!-- Buttons arranged in a 3-per-row grid layout -->
            <input type="radio" class="btn-check" name="product" id="product1" autocomplete="off" value="TMP_2_m_above_ground">
            <label class="btn btn-outline-primary" for="product1">Temperature</label>

            <input type="radio" class="btn-check" name="product" id="product2" autocomplete="off" value="DPT_2_m_above_ground">
            <label class="btn btn-outline-primary" for="product2">Dewpoint</label>

            <input type="radio" class="btn-check" name="product" id="product3" autocomplete="off" value="RH_2_m_above_ground">
            <label class="btn btn-outline-primary" for="product3">Relative Humidity</label>

            <input type="radio" class="btn-check" name="product" id="product4" autocomplete="off" value="GUST_surface">
            <label class="btn btn-outline-primary" for="product4">Wind Speed</label>

            <input type="radio" class="btn-check" name="product" id="product5" autocomplete="off" value="REFC_entire_atmosphere">
            <label class="btn btn-outline-primary" for="product5">Precipitation</label>

            <input type="radio" class="btn-check" name="product" id="product6" autocomplete="off" value="PRESSURE">
            <label class="btn btn-outline-primary" for="product6">Pressure</label>
          </div>
        </div>
        <div class="hour_choice">
          <div id="section_title">Choose an Hour</div>
         <hr>
         <div class="section_content grid-buttons">
            <!-- Creating a 3x6 grid of radio buttons -->

            <input type="radio" class="btn-check" name="hour" id="hour1" autocomplete="off" value ="1">
            <label class="btn btn-outline-primary" for="hour1">1</label>

            <input type="radio" class="btn-check" name="hour" id="hour2" autocomplete="off" value ="2">
            <label class="btn btn-outline-primary" for="hour2">2</label>

            <input type="radio" class="btn-check" name="hour" id="hour3" autocomplete="off" value ="3">
            <label class="btn btn-outline-primary" for="hour3">3</label>

            <input type="radio" class="btn-check" name="hour" id="hour4" autocomplete="off" value ="4">
            <label class="btn btn-outline-primary" for="hour4">4</label>

            <input type="radio" class="btn-check" name="hour" id="hour5" autocomplete="off" value ="5">
            <label class="btn btn-outline-primary" for="hour5">5</label>

            <input type="radio" class="btn-check" name="hour" id="hour6" autocomplete="off" value ="6">
            <label class="btn btn-outline-primary" for="hour6">6</label>

            <input type="radio" class="btn-check" name="hour" id="hour7" autocomplete="off" value ="7">
            <label class="btn btn-outline-primary" for="hour7">7</label>

            <input type="radio" class="btn-check" name="hour" id="hour8" autocomplete="off" value ="8">
            <label class="btn btn-outline-primary" for="hour8">8</label>

            <input type="radio" class="btn-check" name="hour" id="hour9" autocomplete="off" value ="9">
            <label class="btn btn-outline-primary" for="hour9">9</label>

            <input type="radio" class="btn-check" name="hour" id="hour10" autocomplete="off" value ="10">
            <label class="btn btn-outline-primary" for="hour10">10</label>

            <input type="radio" class="btn-check" name="hour" id="hour11" autocomplete="off" value ="11">
            <label class="btn btn-outline-primary" for="hour11">11</label>

            <input type="radio" class="btn-check" name="hour" id="hour12" autocomplete="off" value ="12">
            <label class="btn btn-outline-primary" for="hour12">12</label>

            <input type="radio" class="btn-check" name="hour" id="hour13" autocomplete="off" value ="13">
            <label class="btn btn-outline-primary" for="hour13">13</label>

            <input type="radio" class="btn-check" name="hour" id="hour14" autocomplete="off" value ="14">
            <label class="btn btn-outline-primary" for="hour14">14</label>

            <input type="radio" class="btn-check" name="hour" id="hour15" autocomplete="off" value ="15">
            <label class="btn btn-outline-primary" for="hour15">15</label>

            <input type="radio" class="btn-check" name="hour" id="hour16" autocomplete="off" value ="16">
            <label class="btn btn-outline-primary" for="hour16">16</label>
          </div>
        </div>
      <div class="submit_button">
        <div class="section_content submit-reset-buttons">
          <!-- Styled Submit Button -->
          <label class="btn btn-outline-success" id="submit-button" role="button">SUBMIT</label>

          <!-- Styled Reset Button -->
          <label class="btn btn-outline-danger" id="reset-button" role="button">RESET</label>
        </div>
      </div>
    </div>


    <!-- Model Output Window -->
      <div class="model_output_window">
        <div id="section_title"></div>
        <div class="output-content">
          <img id="model-output-img" src="" alt="Model Output" style="width: 100%; height: 100%; border-radius: 8px; display: none;">
          <p id="error-message" style="color: red; display: none;">Please select all options to generate the URL.</p>
        </div>
     </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <footer class="text-center">
        <div class="container d-flex justify-content-center py-3">
          <button type="button" class="btn btn-primary btn-lg btn-floating mx-2">
            <i class="fab fa-facebook-f"></i>
          </button>
          <button type="button" class="btn btn-primary btn-lg btn-floating mx-2">
            <i class="fab fa-youtube"></i>
          </button>
        </div>
        <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.2);">
          © 2024 Tropica Innovations
        </div>
      </footer>
    </div>
  </div>

  <script>
    $(document).ready(function () {
      ///Users/scottreinhardt/flasktropica/static/images/hrrr/_GUST_surface_3_hour_fcst_forecast_3_us_extent.png
      // Attach a click event listener to the submit button
      $('#submit-button').click(function () {
        // Gather selected values
        let selectedRegion = $('input[name="region"]:checked').val() || "No region selected";
        let selectedModel = $('input[name="model"]:checked').val() || "No model selected";
        let selectedProduct = $('input[name="product"]:checked').val() || "No product selected";
        let selectedHour = $('input[name="hour"]:checked').val() || "No hour selected";
        //let selectedURL = '_' + selectedProduct + '_' + selectedHour + '_hour_fcst_forecast_' + selectedHour + '_' + selectedRegion + '.png';
        let selectedURL = `https://www.pythonanywhere.com/user/tropicainnovations/files/home/tropicainnovations/mysite/static/images/hrrr/_${selectedProduct}_${selectedHour}_hour_fcst_forecast_${selectedHour}_${selectedRegion}.png`

        $('#error-message').hide();

        // Set the image source to the selected URL and display the image
        $('#model-output-img').attr('src', selectedURL).show();
        // Validate that all options are selected
        if (!selectedRegion || !selectedModel || !selectedProduct || !selectedHour) {
          $('#model-output-img').hide();
          $('#error-message').show();
          return;
        }
        return selectedURL;
        // Display all selected values
        alert(`
          Selected region: ${selectedRegion}
          Selected model: ${selectedModel}
          Selected product: ${selectedProduct}
          Selected hour: ${selectedHour}
          Selectedf URL: ${selectedURL}
        `);
      });

      // Attach a reset handler
      $('#reset-button').click(function () {
        // Uncheck all radio buttons
        $('input[type="radio"]').prop('checked', false);

        // Provide feedback
        alert("All selections have been reset.");
      });
    });
  </script>

</body>
</html>
