async function getWeatherData(lat, lon) {
    const url_wx_api = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=weather_code,wind_direction_10m,temperature_2m,dew_point_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,precipitation&hourly=temperature_2m,relative_humidity_2m,dew_point_2m,apparent_temperature,precipitation_probability,wind_speed_10m,wind_gusts_10m,wet_bulb_temperature_2m,cape&daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`;

    const url_five_points_wx = `/`;

    try {
        const response_api = await fetch(url_wx_api);
        if (!response_api.ok) {
            throw new Error(`Open-Meteo API error: ${response_api.status}`);
        }

        const data_api = await response_api.json();
        console.log("API Weather Data:", data_api);

        const response_five_points = await fetch(url_five_points_wx, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ lat: lat, lon: lon })
        });

        if (!response_five_points.ok) {
            throw new Error(`Backend POST error: ${response_five_points.status}`);
        }

        const data_five_points = await response_five_points.json();
        console.log("Backend 5 Points Data:", data_five_points);

        if (!data_api.current) {
            throw new Error("No current weather data available.");
        }
        return {
            api : data_api,
            fiveCities: data_five_points
        };
    } catch (error) {
        console.error("Failed to fetch weather data:", error);
        return null;
    }
}

function addCollapsibleListeners() {
  document.querySelectorAll(".collapsible").forEach(button => {
    button.addEventListener("click", function () {
      this.classList.toggle("active");
      const content = this.nextElementSibling;

      // Remove "display" or "block" logic, and instead use maxHeight
      if (content.style.maxHeight && content.style.maxHeight !== "0px") {
        content.style.maxHeight = null;
      } else {
        content.style.maxHeight = content.scrollHeight + "px";
      }
    });
  });
}
function panMapIframeToUserLocation() {
  const iframe = document.getElementById('mapFrame');

  // Wait until iframe is fully loaded
  iframe.onload = () => {
    try {
      const iframeWindow = iframe.contentWindow;

      // Wait for Folium's map and Leaflet to be initialized inside iframe
      setTimeout(() => {
        if (iframeWindow && iframeWindow.L && iframeWindow.document.querySelector(".folium-map")) {
          const mapElement = iframeWindow.document.querySelector(".folium-map");
          const mapId = mapElement.id;
          const map = iframeWindow[mapId]; // Folium exposes the map globally with its id

          // Use browser geolocation
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
              const lat = position.coords.latitude;
              const lon = position.coords.longitude;

              // Pan and add marker
              map.setView([lat, lon], 9);
              iframeWindow.L.marker([lat, lon])
                .addTo(map)
                .bindPopup("You are here!")
                .openPopup();
            }, (error) => {
              console.error("Geolocation error:", error);
            });
          }
        } else {
          console.error("Leaflet map not found inside iframe.");
        }
      }, 2000); // Adjust delay as needed depending on map loading time
    } catch (err) {
      console.error("Error accessing map inside iframe:", err);
    }
  };
}
